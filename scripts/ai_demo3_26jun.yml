Ex6_0:
  type: message
  text: |
    *Как использовать промпт ментора?*
    
    1️⃣ Можно скопировать его в один из лучших чат-ботов: [ChatGPT](https://chatgpt.com/), [Gemini](https://gemini.google.com/), а среди доступных в России без VPN — [Qwen](https://chat.qwen.ai/), [DeepSeek](https://chat.deepseek.com/), в меньшей степени подойдут бесплатный [Perplexity](https://www.perplexity.ai/) или [Яндекс Алиса](https://yandex.ru/alice).

    2️⃣ Чтобы вести с ИИ более длинный диалог без потери инструкции ментора, нужно задать этот промпт как системный — например, как System Instructions в [Google AI Studio](https://aistudio.google.com/). 

    3️⃣ Можно продолжить общение с ментором прямо в этом чате, где подключена модель GPT-4.1.     
    Правда, здесь нет красивого форматирования текстов, да и ориентироваться в длинных диалогах с ментором здесь тебе будет сложнее.

    Напиши `дальше`, если сейчас *не* хочешь общаться с ментором здесь.
  button: Продолжить в этом чате

Ex6_chat:
  type: dialog
  text: |
    🟡 Напиши "Привет" или какой-то конкретный запрос — и ментор начнет свою работу 😎
    
    #диалог
  temperature: 0.4
  model: gpt-4.1
  prompt: |
    # Persona
    Ты — опытный ментор, говорящий по-русски. Более подробно твоя роль, цель и обязанности описаны в %Context%.
    
    # Context
    Проверь, есть ли "Промпт ментора" в этом чате:
    ```
    {{Ex5_chat[3}}
