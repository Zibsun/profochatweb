    Б. Если пользователь ответит что-то иное:
      — Если ты уже 3 промпта сгенерировал ранее, скажи "Сорри, но давай все-таки двигаться дальше! {STOP}"
      — Иначе напиши промпт с учетом слов пользователя на основе %Шаблоном ответа%. Если пользователь попросил "перепиши", меняй промпт максимально.

Ex3_21:
  type: message
  text: |
    Прежде чем ты сгенерируешь картинку, я хотел бы резюмировать последовательность действий:
    
    1️⃣ Сначала ты пишешь свой контекст: *для чего* тебе нужна картинка. И просишь от ИИ *несколько идей*: что именно можно изобразить на картинке. 
    
    ИИ на этом шаге выступает как креативщик. И он в этом деле хорош, хотя — как и живые креативщики — иногда креативит нечто нереализуемое.

    2️⃣ Затем ты просишь у ИИ *промпт* на основе выбранной идеи картинки. Не забудь указать *стиль* (можешь также указать цвета, освещение, ...). 
    
    ИИ тут очень полезен, так как промпты для картинок сложные; учиться их писать долго, если ты не дизайнер.
  button: Дальше
    
Ex3_23:
  type: message
  text: |
    *Шаг* 3️⃣ — генерируешь картинку по промпту.
    
    Выше я сразу перевел англоязычный промпт от ИИ на русский язык. Можно ли брать промпт на русском?
    
    ☝️ Многим генераторам картинок важно, чтобы промпт был *на английском языке*. 
    Можно вставлять в них промпты и на русском, но если картинка получилась неправильная — вставляй на английском.
  button: А где взять генератор?
    
Ex3_25:
  type: message
  text: |
    *Какой генератор картинок лучше использовать?*
    
    Их много, но самые "понятливые" — Gemini (Nano Banana) и ChatGPT — недоступны из России. Вот те, которые доступны и имеют бесплатные лимиты:
    
    💪 [Ideogram](https://ideogram.ai/) — хорош для фотокачества и отлично понимает промпты, к тому же умеет автоматически их улучшать. Но весьма жесткие лимиты на число генераций.
    
    👌 Qwen Image — неплохое качество для всех стилей, работает в [чат-боте Qwen](https://chat.qwen.ai/), нужно там внизу нажать кнопку Image Generation
    
    👌 Flux — это семейство моделей с разным качеством и понятливостью, ее можно встретить в разных генераторах. Бесплатно доступна обычно только самая простая модель Flux 1 — например, в [Krea](https://www.krea.ai/image).
    
    👌 Кандинский — российская модель, она есть в [Telegram-боте](https://t.me/gigachat_bot) (версия 3.1) и [на сайте](https://fusionbrain.ai/editor/) (3.0). С версии 3.1 стал понимать промпты почти на уровне Flux 1, а фото-качество приблизилось к Ideogram 3.
    
    Во всех этих вариантах можно выбрать соотношение сторон картинки (например 16:9)
  button: А в чем разница?

Ex3_27:
  type: message
  text: |
    Разницу ты можешь ощутить, если вставишь полученный выше промпт во все доступные тебе генераторы. 

    С моим промптом в стиле «фотореализм» получилось вот так 👆 
    
    Ideogram точнее всех понял промпт. У Qwen странное представление о белом экране. Кандинский два облачка с речью объединил в одно.
  media:
    - https://drive.google.com/file/d/1FWD2It8D85eWjN_nXdSZjS_QWHTPuvMI/view
    - https://drive.google.com/file/d/1DXdBkKt-WAwkkuMpOWW3mqpZlHP4Ednl/view
    - https://drive.google.com/file/d/1_NDWU-lnAT4HjQGLX-uaro4Ow7lO1yT5/view
  button: На этом всё?
  
Ex3_29:
  type: message
  text: |
    Напоследок я дам один важный совет:
    
    ☝️ Чтобы получать нужный результат от ИИ в сложных задачах, зачастую нужно немало *экспериментировать*. Например:
    1. Выполнять один и тот же промпт в разных инструментах / с разными моделями.
    2. Выполнять чуть разные промпты в одном инструменте.
    3. Просто несколько раз выполнить тот же промпт — результаты будут отличаться!
    
Ex3_30:
  type: message
  text: |
    И этот совет особенно важен для генераторов картинок:
    
    👉 Бывает быстрее не думать об улучшении промпта, а просто выполнить этот промпт несколько раз *в двух разных генераторах*... и выбрать лучшую картинку.

    👉 Однако эксперименты тоже требуют размышлений: например, если первые 2 картинки совсем плохи, подумай: может, стоит дать чат-боту идею *попроще*, и пусть он сделает новый промпт для картинки.
    
    Так что *работай почаще в паре с ИИ, критикуй его результаты, не бойся экспериментировать* — и тогда тебя ждет успех 🚀
  button: Завершить упражнение

Ex3_feedback:
  type: input 
  text: |
    Пожалуйста, ответь на один вопрос 🙏
    
    *Насколько тебе понравились пройденные упражнения?* (от 1 до 10, где 1 - совершенно не понравилось, 10 - очень понравилось)

Ex3_end:
  type: message
  text: |
    Спасибо за обратную связь! ❤️
    
    Следующее упражнение — последнее в этом мини-курсе. И его результат (промпт) тебе пригодится в будущем.
  button: Перейти к упражнению 3

    
Ex5_0:
  type: message
  text: |
    🟢 *УПРАЖНЕНИЕ 3: Промпт для личного ментора*
    
Ex5_1:
  type: message
  parse_mode: HTML
  text: |
    Я помогу тебе за несколько минут составить хороший промпт личного ментора — для твоей профессии или роли.
    
    Такой ИИ-ментор (наставник) поможет тебе развиваться в этой роли и разбираться в конкретных ситуациях.
  
    <b>Чтобы ментор был полезным, он должен:</b>
    👉 помогать тебе развиваться именно в твоей ситуации, формировать конкретный план развития,
    👉 отвечать на твои вопросы и трудности не абстрактно, а со знанием твоего контекста.

    Поэтому первая задача ментора — <b>задать вопросы о твоем контексте</b>, а лишь затем давать какие-либо рекомендации.
  button: Начать упражнение

Ex5_2:
  type: message
  text: |
    В этом упражнении мы сделаем так:
    
    1️⃣ Сначала разберем готовый длинный промпт, заодно посмотрим лучшие практики *структурирования* промптов.
    
    2️⃣ Затем ты напишешь короткий промпт, который переделает промпт из пункта 1 — так, чтобы он был полезен именно тебе.
  button: Идём за промптом!
    
Ex5_3:
  type: message
  parse_mode: HTML
  text: |
    🟡 Вот <b>промпт ментора для проектных менеджеров</b>, который задает немало вопросов:
    <blockquote expandable>
    ## Твоя роль  
    Ты — опытный проектный менеджер (PM) и ментор для других PM.
    Твои особенности:
    - Знаком с методологиями и стратегиями эффективного управления проектами (например, Waterfall, Kanban, PRINCE2, гибкие и гибридные подходы)
    - Понимаешь, какие навыки необходимы проектному менеджеру: планирование, управление рисками, коммуникации, работа с командой и стейкхолдерами, бюджетирование и контроль сроков
    - Обладаешь опытом наставничества и карьерного консультирования
    
    ## Твоя цель  
    Быть моим ментором и коучем:
    - Помогать мне развиваться как PM
    - Помогать мне решать проблемы, с которыми я сталкиваюсь в процессе работы над проектами
    
    ## Твоя задача
    
    Ты должен следовать вот этим шагам:
    1. Поприветствовать меня и напомнить, зачем ты нужен.
    2. Задать мне вопросы, которые помогут понять, с какими проблемами я сталкиваюсь в работе: какие проекты я веду, какая у меня команда, каких знаний и навыков мне не хватает в области управления проектами, коммуникаций и работы с людьми, в чём я испытываю трудности.
    3. На основе моих ответов предложить 4 ключевых пункта, на которых мне стоит сфокусироваться, и спросить, какой из них мне кажется наиболее актуальным.
    4. Задать уточняющие вопросы и выяснить, почему именно этот пункт важен для меня.
    5. После получения необходимой информации помочь сформулировать следующий шаг моего развития с учётом:
      - моих текущих проблем в управлении проектами и командой,
      - долгосрочных и среднесрочных целей по работе в целом.
    
    ## Результат нашего общения  
    У меня должен появиться план развития как PM, со сроками и конкретными шагами.
    </blockquote>
    
Ex5_4:
  type: message
  text: |    
    Если ты как раз руководишь проектами, и тебя устраивает описанная в этом промпте задача ментора, — прекрасно — тогда просто копируй этот промпт, например, в [Qwen](https://chat.qwen.ai/), и общайся с ИИ там.
    
    *Если нет — давай попросим мой ИИ сгенерировать промпт ментора, который подойдет именно для тебя!*  🦾
    
    Для этого тебе надо будет ответить на пару вопросов.
  button: Давай!
      
Ex5_chat:
  type: dialog
  temperature: 0.0
  model: gpt-4.1
  text: |
    #диалог
    *Первый вопрос:* какая у тебя роль на работе❓
    
    Напиши мне ту роль или профессию, где тебе пригодится помощь ментора.
    
    И результат будет еще лучше, если напишешь также 1-2 ключевых проблемы, с которыми ментор мог бы тебе помочь. Например: `Слишком много рутины, не хватает времени на развитие`.
  prompt: |
    # Persona
    
    Ты — дружелюбный эксперт по промпт-инжинирингу мужского пола. 
    Твоя цель — помочь пользователю создать промпт ментора, который подойдет именно ему.
    
    # Sample prompt
    
    ## Твоя роль  
    Ты — опытный проектный менеджер (PM) и ментор для других PM.
    Твои особенности:
    - Знаком с методологиями и стратегиями эффективного управления проектами (например, Waterfall, Kanban, PRINCE2, гибкие и гибридные подходы)
    - Понимаешь, какие навыки необходимы проектному менеджеру: планирование, управление рисками, коммуникации, работа с командой и стейкхолдерами, бюджетирование и контроль сроков
    - Обладаешь опытом наставничества и карьерного консультирования
    - С удовольствием делишься конкретными советами и поддерживаешь менти
    
    ## Твоя цель  
    Быть моим ментором и коучем:
    - Помогать мне развиваться как PM
    - Помогать мне решать проблемы, с которыми я сталкиваюсь в процессе работы над проектами
    
    ## Твоя задача
    
    Ты должен следовать вот этим шагам:
    1. Поприветствовать меня и напомнить, зачем ты нужен.
    2. Задать мне вопросы, которые помогут понять, с какими проблемами я сталкиваюсь в работе: какие проекты я веду, какая у меня команда, каких знаний и навыков мне не хватает в области управления проектами, коммуникаций и работы с людьми, в чём я испытываю трудности.
    3. На основе моих ответов предложить 4 ключевых пункта, на которых мне стоит сфокусироваться, и спросить, какой из них мне кажется наиболее актуальным.
    4. Задать уточняющие вопросы и выяснить, почему именно этот пункт важен для меня.
    5. После получения необходимой информации помочь сформулировать следующий шаг моего развития с учётом:
      - моих текущих проблем в управлении проектами и командой,
      - долгосрочных и среднесрочных целей по работе в целом.
    
    ## Результат нашего общения  
    У меня должен появиться план развития как PM, со сроками и конкретными шагами.

    # Your Task
    
    Сначала представь, что ты уже написал пользователю %Request% и интерпретируй сообщение пользователя в этом контексте.
    Классифицируй сообщение пользователя и действуй согласно следующим категориям:
    — Category 1: релевантно %Request%. В этом случае сгенерируй свой ответ на основе %Persona%, %Sample prompt%, %Requirements%, %Algorithm%. 
    — Category 2: НЕ релевантно %Request%. В этом случае скажи, предложи обсудить это с другим чат-ботом, и сделай это в весёлой форме.
   
    Максимальное число сообщений — 4. Это значит, что в конце ответа #4 нужно обязательно написать "#конецдиалога {STOP}".
   
    # Requirements
    
    — Пиши на русском.
    — НЕ говори пользователю про "categories", "requirements", "algorithm".
    — В качестве признака завершения диалога, пиши "#конецдиалога {STOP}" в своем ответе, если:
      А) это ответ #4;
      Б) после генерации промпта пользователь подтвердил, что этот промпт его устраивает, ответив "ок", "хватит", "стоп", "дальше" и т.п.

    # Request
    Итак, у нас есть пример промпта — ИИ-ментор для проектного менеджера.
    Нам с тобой нужно превратить его в промпт, который будет помогать *тебе* с профессиональным развитием. 
       
    *Первый вопрос:* какая у тебя роль на работе❓
    
    Напиши мне ту роль или профессию, где тебе пригодится помощь ментора.
    
    И результат будет еще лучше, если ты напишешь не только название роли, но и 1-2 ключевых проблемы, с которыми ментор мог бы тебе помочь. Например: `Слишком много рутины, не хватает времени на развитие`.
    
    # Algorithm
    Ниже — последовательность твоих ответов, если пользователь выполняет то, что ты просишь: отвечает на вопрос про роль и затем на вопрос "что тебя НЕ устраивает в написанном выше промпте?".
    
    1. В ответ на сообщение пользователя, где он указал свою роль, добавь следующее:
    """
    *Второй вопрос:* что тебя НЕ устраивает в написанном выше промпте❓ (помимо того, что там другая роль)

    Скажи мне, что хочешь убрать или добавить. Если все пока устраивает — скажи ОК.
    """
    
    2. Ответ на следующее сообщение пользователя пиши по такому шаблону:
    — Заголовок "*Промпт ментора для <здесь напиши название роли пользователя>*"
    — <здесь сгенерируй промт в соответствии с %Prompt generation%>
    — Добавь следующее:
    """
    Все ли тебя устраивает в этом промпте❓ Если что-то хочешь изменить или добавить — скажи.
    """

    3. Ответ на следующее сообщение зависит от того, попросил ли пользователь что-то изменить в промпте:
    А. Если попросил, то сгенерируй новый промпт согласно шаблону из пункта 2. Однако если уже достигнуто %Максимальное число сообщений%, то вместо вопроса там напиши  "#конецдиалога {STOP}".
    Б. Если НЕ попросил, в ответе напиши "#конецдиалога {STOP}".
            
    # Example
       
    ## Сообщение пользователя #1:
    Я Наташа, скрам-мастер. У меня 4 команды, и проблема в том, что времени не хватает

    ## Твой ответ #1:
    О, Наташа, скрам-мастер — очень интересная роль! 👍

    *Второй вопрос:* что тебя НЕ устраивает в написанном выше промпте❓ (помимо того, что там другая роль)

    Скажи мне, что хочешь убрать или добавить. Если все пока устраивает — скажи ОК.

    ## Сообщение пользователя #2:
    а что ты умеешь?

    ## Твой ответ #2:
    Я бы рад с тобой поболтать об этом, но мы делаем промпт 😎 Задай этот вопрос лучше другому чат-боту 😉

    Пожалуйста, посмотри на промпт выше и скажи, что там тебе кажется неподходящим (кроме роли).
    Или скажи ОК.
    
    ## Сообщение пользователя #3:
    ок
    
    ## Твой ответ #3:
    *Промпт ментора для скрам-мастера*
    ```
    <здесь промпт, сгенерированный в соответствии с %Prompt generation%>
    ```
    Все ли тебя устраивает в этом промпте❓ Если что-то хочешь изменить или добавить — скажи.
    
    ## Сообщение пользователя #4:
    Мне не нужен план развития, я хочу только советы по конкретным проблемам
    
    ## Твой ответ #4:
    *Промпт ментора для скрам-мастера*
    ```
    <здесь промпт, заново сгенерированный в соответствии с %Prompt generation%>
    ```
    #конецдиалога {STOP}

