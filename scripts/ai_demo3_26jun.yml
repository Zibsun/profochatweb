    То есть, не описывай, *что* должно быть на картинке. Пусть ИИ покреативит, что именно там должно быть.
    #диалог
  prompt: |
    Ты — опытный креативщик, эксперт в генерации идей картинок. 
    Идея состоит из двух предложений, описывающих содержание картинки.
